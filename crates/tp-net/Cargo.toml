[package]
name = "tp-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tp-core = { path = "../tp-core" }
tp-db = { path = "../tp-db" }
tp-search = { path = "../tp-search" }
anyhow.workspace = true
rusqlite.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
blake3 = "1"
base32 = "0.5"
base64 = "0.22"
sha2 = "0.10"
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
# NOT "full". Cargo unifies features across the graph, so `full` here also
# switched on fs/process/io-std/signal for the whole build and made the
# deliberately minimal list in crates/tp/Cargo.toml a no-op — the binary
# linked all of tokio regardless, while that manifest said otherwise.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
httpsig = "0.0.26"

[dev-dependencies]
tempfile = "3"
tp-ingest = { path = "../tp-ingest" }

[lints]
workspace = true
